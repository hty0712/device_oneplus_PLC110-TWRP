name: Build TWRP 16 for OnePlus Ace 5 Ultra (PLC110)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP manifest URL'
        required: true
        default: 'https://github.com/TWRP-Test/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'Manifest branch'
        required: true
        default: 'twrp-16.0'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'master'
      DEVICE_PATH:
        description: 'Device path'
        required: true
        default: 'device/oneplus/PLC110'
      DEVICE_NAME:
        description: 'Device name'
        required: true
        default: 'PLC110'
      MAKEFILE_NAME:
        description: 'Lunch target'
        required: true
        default: 'twrp_PLC110'
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'vendorbootimage'
      STOCK_URL:
        description: 'Stock image mirror (boot_b.img / vendor_boot_b.img)'
        required: true
        default: 'https://file.hty1234.eu.org/'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Display run parameters
      run: |
        echo "::group::Build parameters"
        echo "Manifest: ${{ inputs.MANIFEST_URL }}"
        echo "Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device: ${{ inputs.DEVICE_NAME }}"
        echo "Path: ${{ inputs.DEVICE_PATH }}"
        echo "Lunch: ${{ inputs.MAKEFILE_NAME }}"
        echo "Target: ${{ inputs.BUILD_TARGET }}"
        echo "::endgroup::"

    - name: Free disk space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Check out
      uses: actions/checkout@v4

    - name: Set up swap
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Install build dependencies
      run: |
        sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
          bc bison build-essential ccache curl flex git gnupg gperf \
          imagemagick libncurses-dev libssl-dev libx11-dev \
          libxml2 libxml2-utils lz4 lzop mtools pngcrush python3 rsync \
          schedtool squashfs-tools xsltproc zip unzip zlib1g-dev zstd \
          erofs-utils dosfstools

    - name: Set up OpenJDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir -p workspace
        cd workspace
        git config --global user.name "PLC110-TWRP-Build"
        git config --global user.email "build@twrp.local"
        repo init --depth=1 -u "${{ inputs.MANIFEST_URL }}" -b "${{ inputs.MANIFEST_BRANCH }}"

    - name: Sync sources
      run: |
        repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags
      working-directory: workspace

    - name: Clone device tree
      run: |
        mkdir -p "$(dirname "${{ inputs.DEVICE_PATH }}")"
        git clone "${{ github.server_url }}/${{ github.repository }}.git" \
          -b "${{ inputs.DEVICE_TREE_BRANCH }}" "${{ inputs.DEVICE_PATH }}"
      working-directory: workspace

    - name: Apply TWRP source patches
      run: |
        for patch in "${{ inputs.DEVICE_PATH }}"/tools/patches/*.patch; do
          [ -e "${patch}" ] || continue
          git -C bootable/recovery apply "${patch}"
        done
      working-directory: workspace

    - name: Extract prebuilts
      env:
        STOCK_URL: ${{ inputs.STOCK_URL }}
      run: |
        chmod +x tools/extract-prebuilts.sh
        bash tools/extract-prebuilts.sh --download
      working-directory: workspace/${{ inputs.DEVICE_PATH }}

    - name: Build vendor_boot
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        lunch "${{ inputs.MAKEFILE_NAME }}-bp2a-userdebug"
        mka "${{ inputs.BUILD_TARGET }}"
      working-directory: workspace

    - name: Verify vendor_boot ramdisk table
      run: |
        python3 "${{ inputs.DEVICE_PATH }}/tools/unpack_bootimg.py" \
          --boot_img "out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img" \
          --format info
      working-directory: workspace

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img
        name: ${{ inputs.DEVICE_NAME }}-twrp16-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          TWRP 3.7.1_16 for OnePlus Ace 5 Ultra (PLC110)
          Platform: MediaTek MT6991, Android 16, GKI 6.6
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Target: ${{ inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}